<!DOCTYPE html>

  <title>Page not found - Enkode</title>
  <meta name="author" content="Enkode">
  <meta name="format-detection" content="telephone=no">
  <base href="/">
  <script>
    (function () {
      // The old server ignored upper and lower case in addresses; this host does not.
      var path = window.location.pathname;
      if (/\.(aspx|axd)\/?$/i.test(path) && path !== path.toLowerCase()) {
        window.location.replace(path.toLowerCase() + window.location.search + window.location.hash);
        return;
      }
      // This page is shown for any missing address, at any depth, so its links start from the site root.
      // On a *.github.io project address the site root is /<repository>/, not the root of the host.
      if (/\.github\.io$/i.test(window.location.hostname)) {
        document.querySelector('base').href = '/' + path.split('/')[1] + '/';
      }
    })();
  </script>
